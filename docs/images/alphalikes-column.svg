<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-label="Zotero 条目列表中的 AlphaPulse 列：点赞数按下高下低着色，引用数单独一列">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <linearGradient id="top" x1="0" x2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 16px; fill: #1e293b; }
      .meta { font-size: 14px; fill: #64748b; }
      .head { font-size: 14px; font-weight: 600; fill: #475569; letter-spacing: .02em; }
      .num { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .high { fill: #1a7f37; }
      .low { fill: #9aa0a6; }
      .mid { fill: #334155; }
      .calm { fill: #94a3b8; font-size: 13px; font-weight: 500; }
      .trend { font-size: 12px; font-weight: 600; fill: #15803d; }
    </style>
  </defs>

  <rect width="1280" height="660" fill="#eef2f6"/>
  <rect x="56" y="40" width="1168" height="580" rx="16" fill="#fff" filter="url(#shadow)"/>

  <!-- title bar -->
  <path d="M72 40h1136a16 16 0 0 1 16 16v50H56V56a16 16 0 0 1 16-16Z" fill="url(#top)"/>
  <circle cx="88" cy="72" r="8" fill="#fb7185"/><circle cx="114" cy="72" r="8" fill="#fbbf24"/><circle cx="140" cy="72" r="8" fill="#34d399"/>
  <text x="640" y="79" text-anchor="middle" class="ui" font-size="18" font-weight="600" fill="#334155">Zotero — My Library</text>

  <!-- toolbar -->
  <rect x="56" y="106" width="1168" height="46" fill="#fbfcfe"/>
  <line x1="56" y1="152" x2="1224" y2="152" stroke="#e2e8f0"/>
  <rect x="76" y="118" width="86" height="24" rx="6" fill="#eef2ff"/>
  <text x="119" y="135" text-anchor="middle" class="ui" font-size="13" font-weight="600" fill="#4338ca">AlphaPulse</text>
  <path d="M188 130h56M188 121v18m56-18v18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <rect x="272" y="120" width="230" height="22" rx="11" fill="#f1f5f9"/>
  <text x="290" y="136" class="ui" font-size="13" fill="#94a3b8">🔍  Search library…</text>

  <!-- left pane -->
  <rect x="56" y="152" width="228" height="468" fill="#f8fafc"/>
  <line x1="284" y1="152" x2="284" y2="620" stroke="#e2e8f0"/>
  <rect x="72" y="172" width="196" height="34" rx="7" fill="#e0e7ff"/>
  <text x="90" y="195" class="ui" font-size="15" font-weight="600" fill="#3730a3">▾  My Library</text>
  <text x="94" y="238" class="ui" font-size="14" fill="#475569">▱  All Items</text>
  <text x="94" y="268" class="ui" font-size="14" fill="#475569">▱  arXiv</text>
  <text x="94" y="298" class="ui" font-size="14" fill="#475569">▱  Preprints</text>

  <!-- column headers -->
  <rect x="284" y="152" width="940" height="34" fill="#f1f5f9"/>
  <text x="304" y="174" class="ui head">Title</text>
  <text x="700" y="174" class="ui head">Creator</text>
  <text x="880" y="174" class="ui head">Year</text>
  <rect x="950" y="152" width="118" height="34" fill="#e0e7ff"/>
  <text x="962" y="174" class="ui" font-size="14" font-weight="700" fill="#3730a3">alphaXiv 点赞 ⌄</text>
  <rect x="1068" y="152" width="156" height="34" fill="#e0e7ff"/>
  <text x="1080" y="174" class="ui" font-size="14" font-weight="700" fill="#3730a3">引用数 ⌄</text>
  <line x1="284" y1="186" x2="1224" y2="186" stroke="#e2e8f0"/>

  <!-- rows -->
  <g class="ui">
    <rect x="284" y="186" width="940" height="46" fill="#f5f8ff"/>
    <text x="304" y="206" class="title">Attention Is All You Need</text>
    <text x="304" y="224" class="meta">1706.03762 · NeurIPS</text>
    <text x="700" y="215" class="meta">Vaswani et al.</text>
    <text x="884" y="215" class="meta">2017</text>
    <text x="1050" y="215" class="num high" text-anchor="end">1126</text>
    <text x="1216" y="215" class="num mid" text-anchor="end">112,340</text>

    <rect x="284" y="232" width="940" height="46" fill="#fff"/>
    <text x="304" y="252" class="title">Deep Residual Learning for Image Recognition</text>
    <text x="304" y="270" class="meta">1512.03385 · CVPR</text>
    <text x="700" y="261" class="meta">He et al.</text>
    <text x="884" y="261" class="meta">2016</text>
    <text x="1050" y="261" class="num mid" text-anchor="end">233</text>
    <text x="1216" y="261" class="num high" text-anchor="end">96,210</text>

    <rect x="284" y="278" width="940" height="46" fill="#f5f8ff"/>
    <text x="304" y="298" class="title">Nanometre-scale thermometry in a living cell</text>
    <text x="304" y="316" class="meta">1304.1068 · Nature</text>
    <text x="700" y="307" class="meta">Kucsko et al.</text>
    <text x="884" y="307" class="meta">2013</text>
    <text x="1050" y="307" class="num high" text-anchor="end">2979</text>
    <text x="1096" y="307" class="trend">↑12</text>
    <text x="1216" y="307" class="num low" text-anchor="end">1,024</text>

    <rect x="284" y="324" width="940" height="46" fill="#fff"/>
    <text x="304" y="344" class="title">Gravitational Waves from a Binary Black Hole Merger</text>
    <text x="304" y="362" class="meta">1602.03837 · PRL</text>
    <text x="700" y="353" class="meta">Abbott et al.</text>
    <text x="884" y="353" class="meta">2016</text>
    <text x="1050" y="353" class="num low" text-anchor="end">6</text>
    <text x="1216" y="353" class="num mid" text-anchor="end">38,902</text>

    <rect x="284" y="370" width="940" height="46" fill="#f5f8ff"/>
    <text x="304" y="390" class="title">Survey of Techniques for Approximate Computing</text>
    <text x="304" y="408" class="meta">DOI: 10.1145/2893356 · ACM CSUR</text>
    <text x="700" y="399" class="meta">Mittal</text>
    <text x="884" y="399" class="meta">2016</text>
    <text x="1050" y="399" class="calm" text-anchor="end">…</text>
    <text x="1216" y="399" class="num mid" text-anchor="end">1,733</text>

    <rect x="284" y="416" width="940" height="46" fill="#fff"/>
    <text x="304" y="436" class="title">The Design of Everyday Things</text>
    <text x="304" y="454" class="meta">Book · not an arXiv record</text>
    <text x="700" y="445" class="meta">Norman</text>
    <text x="884" y="445" class="meta">1988</text>
    <text x="1216" y="445" class="num low" text-anchor="end">12,004</text>
  </g>

  <!-- legend -->
  <g class="ui">
    <rect x="284" y="470" width="940" height="150" fill="#fbfcfe"/>
    <line x1="284" y1="470" x2="1224" y2="470" stroke="#e2e8f0"/>
    <text x="308" y="504" font-size="14" font-weight="700" fill="#1e293b">列里出现的几种情况</text>

    <text x="308" y="536" class="num high">1126</text>
    <text x="364" y="536" class="meta">达到高赞阈值（默认绿色）</text>

    <text x="308" y="562" class="num low">6</text>
    <text x="364" y="562" class="meta">低于低赞阈值（默认灰色）</text>

    <text x="308" y="588" class="calm">…</text>
    <text x="364" y="588" class="meta">正在读取，读完一条显示一条</text>

    <text x="308" y="614" class="calm">（空白）</text>
    <text x="364" y="614" class="meta">没有读数（未匹配、未选中或读取失败）——鼠标悬停会说明原因</text>

    <text x="764" y="536" class="meta">颜色、阈值与范围筛选都在设置里；引用数可与点赞数共用外观，</text>
    <text x="764" y="556" class="meta">也可以单独设置。数字缓存在条目的 Extra 字段，可随文献库同步。</text>
    <text x="764" y="588" class="meta">2979 ↑12 是每日快照带来的趋势。</text>
  </g>
</svg>
