name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check
      - name: Check add-on assets
        run: npm run check:addon

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      # One job per Zotero major version the plugin claims to support: a cell
      # that renders on the beta build can still be blank on the oldest one,
      # and the item-tree APIs we touch differ between them. The patches are
      # pinned so a run is reproducible; bump them deliberately. Zotero 8 is
      # tested on 8.0.4 because the 8.0.5 Linux build is not downloadable.
      # Zotero downloads do not carry a nightly, so the channel that used to be
      # tested (beta) is covered by the newest release here instead.
      fail-fast: false
      matrix:
        zotero:
          - "7.0.32"
          - "8.0.4"
          - "9.0.6"
          - "10.0.3"
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Download Zotero ${{ matrix.zotero }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zt
          # 7.x is published as .tar.bz2, 8.x and newer as .tar.xz.
          ok=""
          for ext in tar.xz tar.bz2; do
            url="https://download.zotero.org/client/release/${{ matrix.zotero }}/Zotero-${{ matrix.zotero }}_linux-x86_64.$ext"
            if curl -fsSL --retry 3 -o "/tmp/zotero.$ext" "$url"; then
              case "$ext" in
                tar.xz) tar -xJf "/tmp/zotero.$ext" -C /tmp/zt --strip-components=1 ;;
                tar.bz2) tar -xjf "/tmp/zotero.$ext" -C /tmp/zt --strip-components=1 ;;
              esac
              ok=1
              break
            fi
          done
          test -n "$ok" || { echo "no download for ${{ matrix.zotero }}"; exit 1; }
          test -x /tmp/zt/zotero
          # Pointing the scaffold at this binary makes it skip its own download,
          # so exactly this build is exercised.
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=/tmp/zt/zotero" >> "$GITHUB_ENV"
      - name: Run tests on Zotero ${{ matrix.zotero }}
        run: npm run test
