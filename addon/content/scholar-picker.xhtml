<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Scholar record picker.

  Opened by src/modules/menu.ts through `window.openDialog` with a
  `ScholarPickerRequest` object in `window.arguments[0]`. See scholar-picker.js.

  The point of the dialog is that the search is already done when it opens:
  the list carries the paper's own title, its author/venue line and the
  "Cited by" count of each hit, so choosing is a click rather than a retype.

  The <script> tag is the LAST element on purpose: a classic script executes
  while the document is still being parsed, so anything above it would not
  exist yet and every `getElementById` in the script would return null.
-->
<window
  id="alphalikes-scholar-picker"
  windowtype="alphalikes:scholar-picker"
  title="Choose the Google Scholar record"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  width="820"
  height="640"
  persist="screenX screenY width height"
>
  <vbox flex="1" style="padding: 14px; gap: 8px">
    <description id="item-title" style="font-weight: 600" />
    <description id="item-summary" style="opacity: 0.75" />
    <description id="pinned" hidden="true" style="opacity: 0.75" />

    <separator />

    <description id="heading" style="font-weight: 600" />
    <description id="subheading" style="opacity: 0.75" />
    <description id="status" style="opacity: 0.85" />

    <vbox
      id="result-box"
      flex="1"
      style="
        overflow: auto;
        min-height: 260px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 6px;
        padding: 6px;
      "
    >
      <radiogroup id="result-group" flex="1" />
      <description
        id="empty-message"
        hidden="true"
        style="opacity: 0.75; padding: 8px"
      />
    </vbox>
  </vbox>

  <separator />

  <hbox style="padding: 10px 14px; gap: 8px; align-items: center">
    <button id="search-again" />
    <button id="open-browser" />
    <spacer flex="1" />
    <button id="clear" />
    <button id="cancel" />
    <button id="apply" default="true" />
  </hbox>

  <script src="scholar-picker.js" />
</window>
