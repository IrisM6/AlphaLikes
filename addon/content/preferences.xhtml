<!--
  AlphaPulse settings pane.

  Loaded by Zotero.PreferencePanes.register() from src/hooks.ts.

  IMPORTANT: this file is parsed with MozXULElement.parseXULToFragment(), which
  wraps the markup in a div and then runs it through an XML parser. An XML
  declaration is only legal at the very start of a document, so one here would
  land mid-document and the parser would reject the whole pane as
  "not well-formed", leaving the settings page blank. This file therefore
  starts directly with an element, as Zotero's own panes do.

  (This comment deliberately avoids two consecutive hyphens, which XML forbids
  inside a comment, and does not spell out the declaration keyword.)

  Localisation: the linkset below pulls in the plugin's Fluent file. The href
  is the *built* file name - zotero-plugin-scaffold prefixes every FTL with the
  add-on reference - and it is a bare file name because Zotero resolves plugin
  FTLs by name, not by path. The same file is inserted from
  addon/content/preferences.js before this markup is parsed, so the pane is
  translated even if this link is not picked up early enough.

  Every string also carries a Chinese fallback in the markup itself. Fluent
  replaces it when the file resolves, and the fallback keeps the pane readable
  if it ever does not. Controls use `label` attributes because that is what
  Zotero's Fluent messages target for checkboxes, radios and menu items.

  The preference attributes carry keys without the branch prefix; the build
  rewrites them to full extensions.zotero.alphalikes.* names.
-->
<vbox
  id="zotero-prefpane-alphalikes"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <linkset>
    <html:link rel="localization" href="alphalikes-addon.ftl" />
  </linkset>

  <description data-l10n-id="pref-pane-intro" style="opacity: 0.8"
    >自动读取每篇文献在 alphaXiv 上的点赞数与引用数，并把结果写入条目的 Extra
    字段。</description
  >

  <groupbox class="main-section">
    <label><html:h2 data-l10n-id="pref-match-title">arXiv 匹配</html:h2></label>
    <description data-l10n-id="pref-match-desc" style="opacity: 0.8">
      AlphaPulse 会从链接、DOI 或 Extra 字段里读取 arXiv
      记录；条目里没有时，可以通过学术 API 自动查找。
    </description>

    <checkbox
      id="alphalikes-pref-auto-resolve"
      preference="autoResolveNonArxiv"
      data-l10n-id="pref-match-auto"
      label="为没有 arXiv ID 的条目自动查找"
      native="true"
    />

    <hbox align="center">
      <label data-l10n-id="pref-match-auto-accept"
        >达到该置信度（%）时自动采用</label
      >
      <html:input
        type="number"
        preference="autoAcceptPercent"
        min="50"
        max="100"
        step="5"
        style="width: 5em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-match-title-results"
        >每次标题搜索返回的结果数</label
      >
      <html:input
        type="number"
        preference="titleSearchResults"
        min="1"
        max="20"
        step="1"
        style="width: 5em"
      />
    </hbox>

    <checkbox
      id="alphalikes-pref-use-arxiv"
      preference="useArxivTitleSearch"
      data-l10n-id="pref-match-use-arxiv"
      label="通过标题搜索 arXiv API"
      native="true"
    />
    <checkbox
      id="alphalikes-pref-use-s2"
      preference="useSemanticScholar"
      data-l10n-id="pref-match-use-s2"
      label="使用 Semantic Scholar（DOI 与标题）"
      native="true"
    />
    <checkbox
      id="alphalikes-pref-use-openalex"
      preference="useOpenAlex"
      data-l10n-id="pref-match-use-openalex"
      label="使用 OpenAlex（DOI 与标题）"
      native="true"
    />
    <checkbox
      id="alphalikes-pref-use-crossref"
      preference="useCrossref"
      data-l10n-id="pref-match-use-crossref"
      label="使用 Crossref（DOI 元数据）"
      native="true"
    />
    <checkbox
      id="alphalikes-pref-use-unpaywall"
      preference="useUnpaywall"
      data-l10n-id="pref-match-use-unpaywall"
      label="使用 Unpaywall（需要填写联系邮箱）"
      native="true"
    />

    <hbox align="center">
      <label data-l10n-id="pref-match-contact"
        >OpenAlex / Unpaywall 联系邮箱</label
      >
      <html:input
        type="text"
        preference="contactEmail"
        placeholder="you@example.org"
        style="min-width: 16em"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-appearance-title">外观</html:h2></label>
    <description data-l10n-id="pref-appearance-desc" style="opacity: 0.8">
      点赞数在列里的显示方式；颜色由下面的「颜色」一节决定。
    </description>

    <hbox align="center">
      <label
        id="alphalikes-pref-style-label"
        data-l10n-id="pref-appearance-style"
        control="alphalikes-pref-style"
        >显示样式</label
      >
      <menulist id="alphalikes-pref-style" preference="likeStyle" native="true">
        <menupopup>
          <menuitem
            value="plain"
            data-l10n-id="pref-style-plain"
            label="纯文本"
          />
          <menuitem
            value="badge"
            data-l10n-id="pref-style-badge"
            label="玻璃胶囊"
          />
          <menuitem
            value="ring"
            data-l10n-id="pref-style-ring"
            label="玻璃圆形"
          />
          <menuitem
            value="bookmark"
            data-l10n-id="pref-style-bookmark"
            label="侧边强调块"
          />
          <menuitem
            value="morandi"
            data-l10n-id="pref-style-morandi"
            label="莫兰迪低饱和"
          />
          <menuitem
            value="academic"
            data-l10n-id="pref-style-academic"
            label="学术严谨"
          />
          <menuitem
            value="fresh"
            data-l10n-id="pref-style-fresh"
            label="淡雅清新"
          />
          <menuitem
            value="playful"
            data-l10n-id="pref-style-playful"
            label="活泼明快"
          />
          <menuitem
            value="outline"
            data-l10n-id="pref-style-outline"
            label="细边框描边"
          />
          <menuitem
            value="split"
            data-l10n-id="pref-style-split"
            label="双色拼接"
          />
          <menuitem
            value="dot"
            data-l10n-id="pref-style-dot"
            label="数字角标"
          />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-color-title">颜色</html:h2></label>
    <checkbox
      id="alphalikes-pref-colors"
      preference="colorEnabled"
      data-l10n-id="pref-color-enabled"
      label="为点赞数着色"
      native="true"
    />

    <hbox align="center">
      <label
        id="alphalikes-pref-color-mode-label"
        data-l10n-id="pref-color-mode"
        control="alphalikes-pref-color-mode"
        >着色依据</label
      >
      <menulist
        id="alphalikes-pref-color-mode"
        preference="colorMode"
        native="true"
      >
        <menupopup>
          <menuitem
            value="threshold"
            data-l10n-id="pref-color-mode-threshold"
            label="固定阈值"
          />
          <menuitem
            value="quantile"
            data-l10n-id="pref-color-mode-quantile"
            label="按当前列表排名（分位数）"
          />
        </menupopup>
      </menulist>
    </hbox>

    <vbox id="alphalikes-color-quantile-rows" style="gap: 6px">
      <hbox align="center">
        <label data-l10n-id="pref-color-quantile-low">低赞分位（%）</label>
        <html:input
          type="number"
          preference="quantileLowPercent"
          min="0"
          max="99"
          step="5"
          style="width: 5em"
        />
        <label data-l10n-id="pref-color-quantile-high">高赞分位（%）</label>
        <html:input
          type="number"
          preference="quantileHighPercent"
          min="1"
          max="100"
          step="5"
          style="width: 5em"
        />
      </hbox>
      <description data-l10n-id="pref-color-quantile-note" style="opacity: 0.8">
        分位数按当前列表里的数字排名：低于低分位的算低、高于高分位的算高，样本太少时自动退回固定阈值。
      </description>
    </vbox>

    <vbox id="alphalikes-color-threshold-rows" style="gap: 6px">
      <hbox align="center">
        <label data-l10n-id="pref-color-high-threshold">高赞阈值</label>
        <html:input
          type="number"
          preference="highLikesThreshold"
          min="0"
          step="10"
          style="width: 6em"
        />
      </hbox>
      <hbox align="center">
        <label data-l10n-id="pref-color-low-threshold">低赞阈值</label>
        <html:input
          type="number"
          preference="lowLikesThreshold"
          min="0"
          step="10"
          style="width: 6em"
        />
      </hbox>
    </vbox>

    <hbox align="center">
      <label data-l10n-id="pref-color-high">颜色</label>
      <html:input
        class="alphalikes-color-input"
        type="text"
        preference="highLikesColor"
        style="width: 9em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-color-low">颜色</label>
      <html:input
        class="alphalikes-color-input"
        type="text"
        preference="lowLikesColor"
        style="width: 9em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-color-mid"
        >中间区间颜色（留空则使用主题色）</label
      >
      <html:input
        class="alphalikes-color-input"
        type="text"
        preference="midLikesColor"
        style="width: 9em"
      />
    </hbox>

    <hbox align="center">
      <button
        id="alphalikes-pref-like-colors-reset"
        data-l10n-id="pref-color-reset"
        label="恢复这个样式的默认颜色"
      />
      <description data-l10n-id="pref-color-reset-note" style="opacity: 0.8"
        >改过颜色后可以随时点这里回到当前样式的配色。</description
      >
    </hbox>

    <description data-l10n-id="pref-color-picker" style="opacity: 0.8">
      每个颜色框左边是当前颜色的预览，点一下展开取色面板：上面是明度/饱和度色域，下面是色相条，点或拖那一个圆圈就能取色；也可以直接手输
      CSS 颜色（#1a7f37、green、rgb(26 127 55)）。
    </description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-filter-title">只看高赞</html:h2></label>
    <description data-l10n-id="pref-filter-desc" style="opacity: 0.8">
      把列聚焦在一段点赞区间内；边界为 0
      表示不限制。范围之外的条目仍然显示，只是整格变淡。
    </description>

    <checkbox
      id="alphalikes-pref-range"
      preference="rangeFilterEnabled"
      data-l10n-id="pref-filter-enabled"
      label="启用点赞数范围筛选"
      native="true"
    />

    <hbox align="center">
      <label data-l10n-id="pref-filter-min">最少点赞数</label>
      <html:input
        type="number"
        preference="rangeFilterMin"
        min="0"
        step="10"
        style="width: 6em"
      />
      <label data-l10n-id="pref-filter-max">最多点赞数（0 = 不限制）</label>
      <html:input
        type="number"
        preference="rangeFilterMax"
        min="0"
        step="10"
        style="width: 6em"
      />
    </hbox>
  </groupbox>
  <groupbox>
    <label
      ><html:h2 data-l10n-id="pref-citation-appearance-title"
        >引用数外观</html:h2
      ></label
    >
    <description
      data-l10n-id="pref-citation-appearance-desc"
      style="opacity: 0.8"
    >
      引用数和点赞数往往差着数量级，同一套阈值常常不好用。勾选「跟随点赞」时两列外观完全一致，只在「外观」「颜色」「只看高赞」里设置一次即可；取消勾选后，下面这一组只作用于「引用数」列。
    </description>

    <checkbox
      id="alphalikes-pref-appearance-linked"
      preference="appearanceLinked"
      data-l10n-id="pref-citation-appearance-linked"
      label="引用数跟随点赞的外观设置"
      native="true"
    />

    <vbox id="alphalikes-citation-appearance" hidden="true" style="gap: 6px">
      <hbox align="center">
        <label
          id="alphalikes-citation-style-label"
          data-l10n-id="pref-citation-appearance-style"
          control="alphalikes-pref-citation-style"
          >引用数显示样式</label
        >
        <menulist
          id="alphalikes-pref-citation-style"
          preference="citationStyle"
          native="true"
        >
          <menupopup>
            <menuitem
              value="plain"
              data-l10n-id="pref-style-plain"
              label="纯文本"
            />
            <menuitem
              value="badge"
              data-l10n-id="pref-style-badge"
              label="玻璃胶囊"
            />
            <menuitem
              value="ring"
              data-l10n-id="pref-style-ring"
              label="玻璃圆形"
            />
            <menuitem
              value="bookmark"
              data-l10n-id="pref-style-bookmark"
              label="侧边强调块"
            />
            <menuitem
              value="morandi"
              data-l10n-id="pref-style-morandi"
              label="莫兰迪低饱和"
            />
            <menuitem
              value="academic"
              data-l10n-id="pref-style-academic"
              label="学术严谨"
            />
            <menuitem
              value="fresh"
              data-l10n-id="pref-style-fresh"
              label="淡雅清新"
            />
            <menuitem
              value="playful"
              data-l10n-id="pref-style-playful"
              label="活泼明快"
            />
            <menuitem
              value="outline"
              data-l10n-id="pref-style-outline"
              label="细边框描边"
            />
            <menuitem
              value="split"
              data-l10n-id="pref-style-split"
              label="双色拼接"
            />
            <menuitem
              value="dot"
              data-l10n-id="pref-style-dot"
              label="数字角标"
            />
          </menupopup>
        </menulist>
      </hbox>

      <checkbox
        id="alphalikes-pref-citation-colors"
        preference="citationColorEnabled"
        data-l10n-id="pref-citation-color-enabled"
        label="为引用数着色"
        native="true"
      />

      <hbox align="center">
        <label
          id="alphalikes-pref-citation-color-mode-label"
          data-l10n-id="pref-citation-color-mode"
          control="alphalikes-pref-citation-color-mode"
          >着色依据</label
        >
        <menulist
          id="alphalikes-pref-citation-color-mode"
          preference="citationColorMode"
          native="true"
        >
          <menupopup>
            <menuitem
              value="threshold"
              data-l10n-id="pref-color-mode-threshold"
              label="固定阈值"
            />
            <menuitem
              value="quantile"
              data-l10n-id="pref-color-mode-quantile"
              label="按当前列表排名（分位数）"
            />
          </menupopup>
        </menulist>
      </hbox>

      <description
        data-l10n-id="pref-citation-color-mode-note"
        style="opacity: 0.8"
        >阈值在下面设置；分位数与「颜色」一节共用低/高百分位，按引用数在当前列表里的排名着色。</description
      >

      <vbox id="alphalikes-citation-threshold-rows" style="gap: 6px">
        <hbox align="center">
          <label data-l10n-id="pref-citation-color-high-threshold"
            >高引阈值</label
          >
          <html:input
            type="number"
            preference="citationHighLikesThreshold"
            min="0"
            step="10"
            style="width: 6em"
          />
        </hbox>
        <hbox align="center">
          <label data-l10n-id="pref-citation-color-low-threshold"
            >低引阈值</label
          >
          <html:input
            type="number"
            preference="citationLowLikesThreshold"
            min="0"
            step="10"
            style="width: 6em"
          />
        </hbox>
      </vbox>

      <hbox align="center">
        <label data-l10n-id="pref-color-high">颜色</label>
        <html:input
          class="alphalikes-color-input"
          type="text"
          preference="citationHighLikesColor"
          style="width: 9em"
        />
      </hbox>

      <hbox align="center">
        <label data-l10n-id="pref-color-low">颜色</label>
        <html:input
          class="alphalikes-color-input"
          type="text"
          preference="citationLowLikesColor"
          style="width: 9em"
        />
      </hbox>

      <hbox align="center">
        <label data-l10n-id="pref-citation-color-mid"
          >中间区间颜色（留空则使用主题色）</label
        >
        <html:input
          class="alphalikes-color-input"
          type="text"
          preference="citationMidLikesColor"
          style="width: 9em"
        />
      </hbox>

      <checkbox
        id="alphalikes-pref-citation-range"
        preference="citationRangeFilterEnabled"
        data-l10n-id="pref-citation-filter-enabled"
        label="启用引用数范围筛选"
        native="true"
      />

      <hbox align="center">
        <label data-l10n-id="pref-citation-filter-min">最少引用数</label>
        <html:input
          type="number"
          preference="citationRangeFilterMin"
          min="0"
          step="10"
          style="width: 6em"
        />
        <label data-l10n-id="pref-citation-filter-max"
          >最多引用数（0 = 不限制）</label
        >
        <html:input
          type="number"
          preference="citationRangeFilterMax"
          min="0"
          step="10"
          style="width: 6em"
        />
      </hbox>

      <description
        data-l10n-id="pref-citation-filter-note"
        style="opacity: 0.8"
      >
        与点赞数的范围筛选一样：范围之外的条目仍然显示，只是整格变淡。
      </description>

      <hbox align="center">
        <button
          id="alphalikes-pref-citation-colors-reset"
          data-l10n-id="pref-citation-color-reset"
          label="恢复引用样式的默认颜色"
        />
      </hbox>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-trend-title">点赞趋势</html:h2></label>
    <description data-l10n-id="pref-trend-desc" style="opacity: 0.8">
      每次刷新会把当天的点赞数记入条目的 Extra 字段，列里就能显示「2979 ↑12」。
    </description>

    <checkbox
      id="alphalikes-pref-show-trend"
      preference="showTrend"
      data-l10n-id="pref-trend-show"
      label="在列里显示每日变化"
      native="true"
    />

    <hbox align="center">
      <label data-l10n-id="pref-trend-hot"
        >每日增长达到该数值视为「近期热门」</label
      >
      <html:input
        type="number"
        preference="trendHotDelta"
        min="0"
        max="100000"
        step="5"
        style="width: 6em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-trend-history"
        >保留最近多少天的快照（写入 Extra，最多 30）</label
      >
      <html:input
        type="number"
        preference="historyDays"
        min="2"
        max="30"
        step="1"
        style="width: 5em"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-citations-title">引用数</html:h2></label>
    <description data-l10n-id="pref-citations-desc" style="opacity: 0.8">
      引用数据来自 Semantic Scholar 与
      OpenAlex。被引次数变化很慢，所以缓存时间比点赞数长。
    </description>

    <checkbox
      id="alphalikes-pref-citations"
      preference="citationsEnabled"
      data-l10n-id="pref-citations-enabled"
      label="显示「引用数」列并查询引用数据"
      native="true"
    />

    <hbox align="center">
      <label data-l10n-id="pref-citations-ttl"
        >缓存多少天后重新读取（0 = 只读一次）</label
      >
      <html:input
        type="number"
        preference="citationCacheTtlDays"
        min="0"
        max="365"
        step="1"
        style="width: 5em"
      />
    </hbox>

    <description
      data-l10n-id="pref-citations-scholar-note"
      style="opacity: 0.8"
    >
      Google Scholar 没有公开 API，插件读取的是搜索结果页上的「Cited
      by」数字。Google 要求人机验证或限流时，插件先自己处理：暂停读取，并按 10
      分钟、20 分钟、40 分钟……（最长 2
      小时）自动重试，前两次不打扰你；连续第三次仍被拦住才弹一条提示，说明还要等多久、以及如何自己完成验证。任何情况下都不会用别的来源顶替这个数字。
    </description>

    <description data-l10n-id="pref-citations-sources" style="opacity: 0.8">
      引用数来源（可以多选；多选时显示其中最大的数字）
    </description>

    <hbox id="alphalikes-citation-sources" style="gap: 16px">
      <checkbox
        id="alphalikes-source-googleScholar"
        class="alphalikes-citation-source"
        data-source="googleScholar"
        data-l10n-id="pref-citations-source-scholar"
        label="Google Scholar（默认）"
        native="true"
      />
      <checkbox
        id="alphalikes-source-openAlex"
        class="alphalikes-citation-source"
        data-source="openAlex"
        data-l10n-id="pref-citations-source-openalex"
        label="OpenAlex"
        native="true"
      />
      <checkbox
        id="alphalikes-source-semanticScholar"
        class="alphalikes-citation-source"
        data-source="semanticScholar"
        data-l10n-id="pref-citations-source-s2"
        label="Semantic Scholar"
        native="true"
      />
    </hbox>

    <description data-l10n-id="pref-citations-source-note" style="opacity: 0.8">
      数字只来自勾选的来源，不会用没勾的来源顶替。选一个时，有就是有、没有就是「暂无」；选多个时全部读取，显示其中最大的那个（悬停可以看到数字来自谁）。三个来源的口径并不一致——Google
      Scholar 收录预印本、学位论文与书籍，和 OpenAlex
      的数字可能差一倍，所以默认只勾 Google Scholar。
    </description>

    <description data-l10n-id="pref-citations-s2-note" style="opacity: 0.8">
      Semantic Scholar 未提供 key 时会限流，遇到 429 会跳过并保留下次机会。
    </description>
  </groupbox>

  <groupbox>
    <label
      ><html:h2 data-l10n-id="pref-refresh-title">刷新与网络</html:h2></label
    >
    <description data-l10n-id="pref-refresh-desc" style="opacity: 0.8">
      右键任意条目可以分别选择「刷新 alphaXiv
      点赞」或「刷新引用数」（列里先显示「…」，完成后弹一条结果提示）；此外缓存也可以按时间自动过期。
    </description>

    <hbox align="center">
      <label data-l10n-id="pref-refresh-ttl"
        >缓存多少天后重新读取点赞数（0 = 不自动）</label
      >
      <html:input
        type="number"
        preference="cacheTtlDays"
        min="0"
        max="365"
        step="1"
        style="width: 5em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-refresh-interval"
        >同一域名请求的最小间隔（毫秒）</label
      >
      <html:input
        type="number"
        preference="requestIntervalMs"
        min="0"
        max="30000"
        step="100"
        style="width: 6em"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-refresh-timeout">请求超时（毫秒）</label>
      <html:input
        type="number"
        preference="requestTimeoutMs"
        min="1000"
        max="60000"
        step="1000"
        style="width: 6em"
      />
    </hbox>

    <separator class="thin" />
    <label
      ><html:h2 data-l10n-id="pref-scholar-pacing"
        >Google Scholar 读取节奏</html:h2
      ></label
    >
    <description data-l10n-id="pref-scholar-pacing-desc" style="opacity: 0.8"
      >读取会按下面的范围随机安排，避免固定节奏；改完对下一次搜索就生效。</description
    >

    <hbox align="center">
      <label data-l10n-id="pref-scholar-interval-min"
        >两次搜索最短间隔（秒）</label
      >
      <html:input
        type="number"
        preference="scholarIntervalMinSeconds"
        min="1"
        max="600"
        step="1"
        style="width: 6em"
      />
      <label
        data-l10n-id="pref-scholar-interval-min-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 16</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-interval-max"
        >两次搜索最长间隔（秒）</label
      >
      <html:input
        type="number"
        preference="scholarIntervalMaxSeconds"
        min="1"
        max="600"
        step="1"
        style="width: 6em"
      />
      <label
        data-l10n-id="pref-scholar-interval-max-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 30</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-dwell">打开页面后停留（秒）</label>
      <html:input
        type="number"
        preference="scholarDwellSeconds"
        min="0"
        max="60"
        step="1"
        style="width: 6em"
      />
      <label
        data-l10n-id="pref-scholar-dwell-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 3</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-batch-min">每批搜索次数下限</label>
      <html:input
        type="number"
        preference="scholarBatchMin"
        min="1"
        max="100"
        step="1"
        style="width: 5em"
      />
      <label
        data-l10n-id="pref-scholar-batch-min-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 2</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-batch-max">每批搜索次数上限</label>
      <html:input
        type="number"
        preference="scholarBatchMax"
        min="1"
        max="100"
        step="1"
        style="width: 5em"
      />
      <label
        data-l10n-id="pref-scholar-batch-max-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 5</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-pause-min"
        >每批后暂停下限（分钟）</label
      >
      <html:input
        type="number"
        preference="scholarPauseMinMinutes"
        min="0"
        max="600"
        step="1"
        style="width: 5em"
      />
      <label
        data-l10n-id="pref-scholar-pause-min-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 10</label
      >
    </hbox>

    <hbox align="center">
      <label data-l10n-id="pref-scholar-pause-max"
        >每批后暂停上限（分钟）</label
      >
      <html:input
        type="number"
        preference="scholarPauseMaxMinutes"
        min="0"
        max="600"
        step="1"
        style="width: 5em"
      />
      <label
        data-l10n-id="pref-scholar-pause-max-hint"
        style="opacity: 0.6; font-size: 0.9em"
        >建议 20</label
      >
    </hbox>
  </groupbox>
</vbox>
